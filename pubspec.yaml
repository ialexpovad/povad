name: povad
description: Transparent Serial to TCP and Bluetooth LE bridges.
publish_to: none
version: 0.2.0+9

environment:
  sdk: ^3.13.1

workspace:
  - packages/povad_core

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shadcn_flutter: 0.0.55
  crypto: ^3.0.7
  ffi: ^2.2.0
  screen_retriever: ^0.2.2
  shared_preferences: 2.5.5
  # 2.5.0's JNI bindings fail in Android release builds after R8 renames
  # kotlin.coroutines.Continuation (flutter/flutter#194649). Keep the last
  # working implementation until the upstream consumer rules ship.
  shared_preferences_android: '>=2.4.28 <2.5.0'
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  povad_core:
    path: packages/povad_core
  bonsoir: ^7.1.5
  qr_flutter: ^4.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  alchemist: 0.14.1

flutter:
  generate: true
  assets:
    - THIRD_PARTY_NOTICES.md
    - assets/brand/icon-256.png
    - assets/brand/icon.ico
    - assets/tray/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
