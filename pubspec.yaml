name: povad
description: Device connectivity, starting with a transparent Serial to TCP bridge.
publish_to: none
version: 0.1.0-rc.1+2

environment:
  sdk: ^3.13.1

workspace:
  - packages/povad_core

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shadcn_flutter: 0.0.55
  shared_preferences: 2.5.5
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  povad_core:
    path: packages/povad_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  alchemist: 0.14.0

flutter:
  generate: true
  assets:
    - THIRD_PARTY_NOTICES.md
    - assets/brand/icon-256.png
    - assets/brand/icon.ico
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
