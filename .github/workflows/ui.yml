name: UI checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-test-diffs
          path: test/failures/
          if-no-files-found: ignore
          retention-days: 14

  macos-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test/app_test.dart -d macos
        timeout-minutes: 8
      - run: flutter build macos --release

  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: sudo apt-get update -y && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter build linux --release

  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: flutter test test/update_install_script_test.dart
      - run: flutter build windows --release

  android-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -Fx 'lib/arm64-v8a/libpovad_core.so'
      - run: unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -Fx 'lib/x86_64/libpovad_core.so'
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: android-pr-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - run: flutter build apk --debug --target-platform android-arm64 --target tool/android_device_smoke.dart
      - run: unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -Fx 'lib/arm64-v8a/libpovad_core.so'
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: android-pr-arm64-smoke-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            flutter test integration_test/android_native_test.dart -d emulator-5554
            flutter test integration_test/bonjour_android_test.dart -d emulator-5554
